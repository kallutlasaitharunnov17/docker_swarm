<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My_Website</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f4f4;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .container{
      text-align:center;
      background:white;
      padding:40px;
      border-radius:10px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    h1{
      color:#333;
      margin-bottom:10px;
    }

    p{
      color:#666;
      margin-bottom:20px;
    }

    button{
      padding:10px 20px;
      border:none;
      background:#007bff;
      color:white;
      border-radius:5px;
      cursor:pointer;
      font-size:16px;
    }

    button:hover{
      background:#0056b3;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Welcome</h1>
    <p>This is a sample index.html page.</p>
    <button onclick="showMessage()">Click Me</button>
  </div>

  <script>
    function showMessage(){
      alert("Hello from JavaScript!");
    }
  </script>

</body>
</html>
